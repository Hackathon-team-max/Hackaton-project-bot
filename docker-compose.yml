version: '3.8'

services:
  backend:
    build: ./server
    # Имя для Docker Hub: `docker compose push` (локально) / `pull` (на сервере).
    image: nikiforovi/max-bot-backend:latest
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Задайте BOT_TOKEN — BOT_TOKEN=... docker compose up -d}
    volumes:
      - db-data:/var/lib/max-bot
      - ./server/russiantrustedca.pem:/var/lib/max-bot/russiantrustedca.pem:ro
    restart: unless-stopped
    networks:
      - docflow-network

  frontend:
    build: ./frontend
    # Имя для Docker Hub: `docker compose push` (локально) / `pull` (на сервере).
    image: nikiforovi/max-bot-frontend:latest
    expose:
      - "4173"
    environment:
      VITE_API_TARGET: http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - docflow-network

  caddy:
    image: caddy:2-alpine
    container_name: docflow-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from noscam.accesscam.org --to frontend:4173
    depends_on:
      - frontend
    networks:
      - docflow-network

volumes:
  db-data:
  caddy_data:
  caddy_config:

networks:
  docflow-network:
    driver: bridge
